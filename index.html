<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Recording</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#57534e;--card:#fff;--line:#e7e5e4;--accent:#2563eb;--accent-fg:#fff;
--warn:#b45309;--warn-bg:#fef3c7;--meter:#16a34a;--whisper:#7c3aed;--library:#0891b2;--far:#ea580c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a09;--fg:#f5f5f4;--muted:#a8a29e;--card:#1c1917;
--line:#292524;--accent:#60a5fa;--accent-fg:#0c0a09;--warn:#fbbf24;--warn-bg:#422006;--meter:#4ade80;--whisper:#a78bfa;
--library:#22d3ee;--far:#fb923c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#bar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:2}
#progress{height:100%;width:0;background:var(--accent);transition:width .3s}
main{max-width:560px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.25;margin:8px 0 12px}
p{margin:0 0 14px}
.muted{color:var(--muted);font-size:15px}
.warn{color:var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:10px}
button{display:block;width:100%;font:inherit;font-weight:600;padding:15px;border-radius:12px;border:1px solid var(--line);
background:var(--card);color:var(--fg);margin:10px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.quiet{background:transparent}
button:disabled{opacity:.45}
button.mini{display:inline-block;width:auto;padding:6px 12px;margin:0 0 0 6px;font-size:14px}
input,select{display:block;width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);
background:var(--card);color:var(--fg);margin:6px 0 14px}
label{display:block;font-size:15px;color:var(--muted)}
label.check{display:flex;gap:12px;align-items:flex-start;color:var(--fg);font-size:16px;margin:0 0 16px}
label.check input{width:24px;height:24px;margin:2px 0 0;flex:none}
.steps{padding-left:20px}.steps li{margin:0 0 10px}
.voice{border-left:4px solid var(--accent);background:var(--card);border-radius:10px;padding:12px 14px;margin:0 0 16px;display:grid;gap:4px}
.voice span{font-size:15px}.voice em{font-size:15px;color:var(--muted)}
.voice-whisper{border-color:var(--whisper)}.voice-library{border-color:var(--library)}.voice-far{border-color:var(--far)}
.script{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
.read{font-size:21px;line-height:1.45;margin:0 0 10px}.read:last-child{margin:0}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.meter i{display:block;height:100%;width:0;background:var(--meter);transition:width .08s}
.cue{text-align:center;font-weight:700;font-size:20px;min-height:30px;color:var(--accent)}
.big{font-size:64px;font-weight:700;text-align:center;margin:10px 0}
.review{list-style:none;padding:0;margin:0 0 16px}
.review li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.review li>span:first-child{flex:1}
.flag{color:var(--warn);font-size:13px;flex-basis:100%;order:3}
.far{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.far-count{font-size:120px;font-weight:800;color:var(--far)}
.far-text{font-size:40px;line-height:1.25;font-weight:600;max-width:900px}
</style>
</head>
<body>
<div id="bar"><div id="progress"></div></div>
<main id="app"><p>Loading…</p></main>
<noscript><main><p>This page needs JavaScript.</p></main></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
